name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://your-project-id.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: your-anon-key-here
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dumbo_placeholder
          CLERK_SECRET_KEY: sk_test_dumbo_placeholder
        run: npm run build

      - name: Ensure public index.html fallback
        run: |
          mkdir -p public
          if [ ! -f public/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Dumbo</title></head><body><div id="__next"></div></body></html>' > public/index.html
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dumbo-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release & Upload APK
        uses: ncipollo/release-action@v1
        if: success()
        with:
          artifacts: "android/app/build/outputs/apk/debug/app-debug.apk"
          tag: "v1.0.${{ github.run_number }}"
          name: "Dumbo Android App v1.0.${{ github.run_number }}"
          body: |
            📱 Official Dumbo Private 2-User Hub Android APK release!
            - Full Offline-First Persistence & Background Re-Sync
            - In-App Background Cellular SMS Support
            - Private 2-User Messaging, Audio Howler Player & WebRTC Calls
          token: ${{ secrets.GITHUB_TOKEN }}
